# ╔══════════════════════════════════════╗
# ║     k3pira — Linux System Monitor    ║
# ║     Configuration File               ║
# ╚══════════════════════════════════════╝

# Soglie alert (percentuale)
CPU_THRESHOLD=80
RAM_THRESHOLD=80
DISK_THRESHOLD=90

# Intervallo monitoraggio (secondi)
MONITOR_INTERVAL=5

# Log
LOG_ENABLED=true
LOG_FILE="logs/monitor.log"
LOG_MAX_LINES=1000

# Interfaccia di rete da monitorare
NET_INTERFACE="wlan0"
